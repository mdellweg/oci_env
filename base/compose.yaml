---
services:
  pulp:
    build:
      context: "{OCI_ENV_DIR}/base/"
      dockerfile: "Dockerfile"
    image: "localhost/oci_env/pulp:base"
    cap_add:
      - "SYS_PTRACE"
      - "SETUID"
      - "SETGID"
    env_file:
      - "{OCI_ENV_DIR}/.compiled/{COMPOSE_PROJECT_NAME}/combined.env"
      - "{OCI_ENV_CONFIG_FILE}"
    environment:
      - "DEV_SOURCE_PATH={DEV_SOURCE_PATH}"
      - "DJANGO_SUPERUSER_USERNAME={DJANGO_SUPERUSER_USERNAME}"
      - "DJANGO_SUPERUSER_PASSWORD={DJANGO_SUPERUSER_PASSWORD}"
      - "API_HOST={API_HOST}"
      - "API_PORT={API_PORT}"
      - "API_PROTOCOL={API_PROTOCOL}"
      - "REMOTE_FIXTURES_ORIGIN={REMOTE_FIXTURES_ORIGIN}"
      - "NGINX_PORT={NGINX_PORT}"
      - "NGINX_SSL_PORT={NGINX_SSL_PORT}"
      - "COMPOSE_PROJECT_NAME={COMPOSE_PROJECT_NAME}"
      - "S6_BEHAVIOUR_IF_STAGE2_FAILS=0"

    ports:
      - "{API_PORT}:{NGINX_PORT}"
    volumes:
      - "{SRC_DIR}:/src:z"
      - "{OCI_ENV_DIR}:/opt/oci_env:z"
      - "pulp:/var/lib/pulp"
      - "redis_data:/data"
      - "pg_data:/var/lib/pgsql"

volumes:
  pulp:
  pg_data:
  redis_data:
...
